<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0420">
<title>COIN FLIP</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{height:100%;overflow:hidden;font-family:'Inter',sans-serif;background:#0a0420;color:#fff;-webkit-font-smoothing:antialiased}
body{position:fixed;width:100%;height:100vh;height:100dvh;overflow:hidden;padding-bottom:env(safe-area-inset-bottom)}

/* ФОН */
.bg{position:fixed;inset:0;z-index:-5;background:linear-gradient(180deg,#0a0420 0%,#150840 50%,#1e0a50 100%)}
.aurora{position:fixed;inset:-30%;z-index:-4;pointer-events:none;background:radial-gradient(ellipse at 20% 20%,rgba(100,60,255,.5) 0%,transparent 45%),radial-gradient(ellipse at 80% 70%,rgba(180,80,255,.45) 0%,transparent 45%),radial-gradient(ellipse at 50% 90%,rgba(70,100,255,.4) 0%,transparent 50%);animation:auroraMove 20s ease-in-out infinite alternate;filter:blur(40px)}
@keyframes auroraMove{0%{transform:translate(0,0) scale(1) rotate(0)}50%{transform:translate(30px,-20px) scale(1.1) rotate(3deg)}100%{transform:translate(-20px,20px) scale(1.15) rotate(-3deg)}}
.fire{position:fixed;inset:0;z-index:-3;pointer-events:none;overflow:hidden}
.fire-blob{position:absolute;border-radius:50%;filter:blur(100px);opacity:.55;mix-blend-mode:screen;animation:fireFloat 12s ease-in-out infinite}
.fire-blob.b1{width:420px;height:420px;background:radial-gradient(circle,#6d28d9,transparent 70%);top:-160px;left:-120px}
.fire-blob.b2{width:380px;height:380px;background:radial-gradient(circle,#a855f7,transparent 70%);top:25%;right:-160px;animation-delay:2s}
.fire-blob.b3{width:340px;height:340px;background:radial-gradient(circle,#2563eb,transparent 70%);bottom:-80px;left:15%;animation-delay:4s}
.fire-blob.b4{width:300px;height:300px;background:radial-gradient(circle,#c084fc,transparent 70%);top:55%;left:35%;animation-delay:6s}
.fire-blob.b5{width:280px;height:280px;background:radial-gradient(circle,#06b6d4,transparent 70%);top:10%;left:50%;animation-delay:8s}
@keyframes fireFloat{0%,100%{transform:translate(0,0) scale(1);opacity:.45}33%{transform:translate(40px,-30px) scale(1.15);opacity:.65}66%{transform:translate(-30px,30px) scale(.95);opacity:.5}}
.glow-top{position:fixed;top:0;left:0;right:0;height:300px;z-index:-3;pointer-events:none;background:radial-gradient(ellipse at 50% 0%,rgba(140,100,255,.4) 0%,transparent 70%)}
.rays{position:fixed;inset:0;z-index:-2;pointer-events:none;overflow:hidden;opacity:.3;mix-blend-mode:screen}
.ray{position:absolute;top:-50%;width:2px;height:200%;background:linear-gradient(180deg,transparent,#c084fc,transparent);transform-origin:top center;animation:rayPulse 6s ease-in-out infinite}
@keyframes rayPulse{0%,100%{opacity:0;transform:scaleY(.5)}50%{opacity:1;transform:scaleY(1)}}
.stars{position:fixed;inset:0;z-index:-2;pointer-events:none;overflow:hidden}
.star{position:absolute;width:2px;height:2px;background:#fff;border-radius:50%;opacity:0;animation:twinkle linear infinite}
@keyframes twinkle{0%,100%{opacity:0}50%{opacity:.9}}
.particles{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
.particle{position:absolute;width:3px;height:3px;border-radius:50%;opacity:0;animation:floatUp linear infinite;box-shadow:0 0 12px currentColor,0 0 24px currentColor}
@keyframes floatUp{0%{transform:translateY(100vh) scale(0) rotate(0);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translateY(-10vh) scale(1) rotate(360deg);opacity:0}}

.app{position:relative;z-index:10;width:100%;height:100%;display:flex;flex-direction:column;overflow:hidden}
.top-bar{display:flex;align-items:center;gap:10px;padding:14px 16px;flex-shrink:0}
.logo{font-size:22px;font-weight:900;color:#ffd700;letter-spacing:2px;text-shadow:0 0 20px rgba(255,215,0,.6),0 0 40px rgba(168,85,247,.5)}
.balance-pill{background:rgba(20,15,50,.85);border:1px solid rgba(168,85,247,.4);padding:8px 14px;border-radius:14px;display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;backdrop-filter:blur(20px);box-shadow:0 0 20px rgba(168,85,247,.3)}
.balance-pill .cur{color:#c084fc;font-size:11px;font-weight:600}
.balance-pill .val{color:#ffd700;font-weight:900;text-shadow:0 0 10px rgba(255,215,0,.6)}
.deposit-btn{background:linear-gradient(135deg,#8b5cf6,#6366f1);color:#fff;border:none;padding:9px 18px;border-radius:14px;font-size:13px;font-weight:800;cursor:pointer;box-shadow:0 4px 20px rgba(139,92,246,.5)}
.deposit-btn:active{transform:scale(.95)}
.avatar{width:38px;height:38px;border-radius:50%;background:rgba(20,15,50,.85);border:1px solid rgba(168,85,247,.4);display:flex;align-items:center;justify-content:center;font-size:14px;color:#c084fc;font-weight:700}

.content{flex:1;overflow-y:auto;padding-bottom:100px;scrollbar-width:none}
.content::-webkit-scrollbar{display:none}

/* БАННЕР */
.banner{margin:0 16px 18px;border-radius:22px;background:linear-gradient(135deg,#6366f1 0%,#3b82f6 60%,#06b6d4 100%);padding:26px 22px;position:relative;overflow:hidden;box-shadow:0 12px 50px rgba(99,102,241,.5),0 0 40px rgba(59,130,246,.4)}
.banner::before{content:'';position:absolute;top:-50%;right:-30%;width:280px;height:280px;background:radial-gradient(circle,rgba(255,255,255,.3),transparent 70%);animation:bannerPulse 4s ease-in-out infinite}
@keyframes bannerPulse{0%,100%{transform:scale(1);opacity:.6}50%{transform:scale(1.2);opacity:1}}
.banner::after{content:'';position:absolute;top:-100%;left:-100%;width:300%;height:300%;background:linear-gradient(45deg,transparent 45%,rgba(255,255,255,.2) 50%,transparent 55%);animation:bannerShine 4s infinite}
@keyframes bannerShine{0%{transform:translateX(-100%) translateY(-100%)}100%{transform:translateX(100%) translateY(100%)}}
.banner-big{font-size:36px;font-weight:900;color:#ffd700;line-height:1;text-shadow:2px 2px 0 rgba(0,0,0,.5),0 0 30px rgba(255,215,0,.6);position:relative;z-index:2}
.banner-sub{font-size:13px;font-weight:900;color:#fff;margin-top:8px;letter-spacing:2px;position:relative;z-index:2;text-shadow:1px 1px 0 rgba(0,0,0,.5)}

/* ТАБЫ */
.tabs{display:flex;gap:8px;padding:0 16px 16px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:9px 18px;border-radius:22px;background:rgba(20,15,50,.7);border:1px solid rgba(168,85,247,.3);color:#c084fc;font-size:12px;font-weight:700;white-space:nowrap;cursor:pointer;backdrop-filter:blur(20px)}
.tab.active{background:linear-gradient(135deg,#8b5cf6,#6366f1);color:#fff;border-color:transparent;box-shadow:0 4px 20px rgba(139,92,246,.6)}

.section{padding:0 16px;margin-bottom:20px}
.section-title{font-size:18px;font-weight:900;margin-bottom:12px;text-shadow:0 0 20px rgba(168,85,247,.4)}

/* СЕТКА 3 КОЛОНКИ — КАК В TON PLAY */
.games-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.game-card{background:linear-gradient(145deg,rgba(30,20,60,.9),rgba(15,10,40,.9));border:1px solid rgba(168,85,247,.3);border-radius:18px;overflow:hidden;text-align:center;cursor:pointer;position:relative;backdrop-filter:blur(20px);transition:transform .2s;box-shadow:0 4px 20px rgba(0,0,0,.4),0 0 20px rgba(168,85,247,.2)}
.game-card:active{transform:scale(.94);border-color:#c084fc;box-shadow:0 0 35px rgba(192,132,252,.7)}
.game-card .game-img{width:100%;height:100px;object-fit:cover;display:block;border-bottom:1px solid rgba(168,85,247,.2)}
.game-card .game-name{font-size:12px;font-weight:800;color:#fff;padding:8px 4px 4px;line-height:1.2}
.game-card .game-tag{font-size:9px;color:#c084fc;padding-bottom:8px;font-weight:600}

/* НИЖНЕЕ МЕНЮ */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:rgba(10,6,35,.95);backdrop-filter:blur(24px);border-top:1px solid rgba(168,85,247,.3);display:flex;justify-content:space-around;padding:10px 0 20px;z-index:100;padding-bottom:calc(10px + env(safe-area-inset-bottom));box-shadow:0 -10px 40px rgba(0,0,0,.6)}
.nav-item{text-align:center;font-size:10px;color:#6a5a9a;flex:1;cursor:pointer;font-weight:700}
.nav-item.active{color:#c084fc}
.nav-icon{width:26px;height:26px;margin:0 auto 4px;border-radius:8px;background:rgba(20,15,50,.8);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800}
.nav-item.active .nav-icon{background:linear-gradient(135deg,#8b5cf6,#6366f1);color:#fff;box-shadow:0 4px 20px rgba(139,92,246,.6)}

/* ЭКРАНЫ */
.screen{position:fixed;inset:0;background:#0a0420;z-index:500;display:none;flex-direction:column;padding:env(safe-area-inset-top) 16px calc(20px + env(safe-area-inset-bottom));overflow-y:auto}
.screen.active{display:flex;animation:screenIn .3s cubic-bezier(.4,0,.2,1)}
@keyframes screenIn{0%{opacity:0;transform:translateX(30px)}100%{opacity:1;transform:translateX(0)}}
.screen-header{display:flex;align-items:center;gap:14px;padding:20px 0;flex-shrink:0}
.back-btn{width:44px;height:44px;border-radius:14px;background:rgba(20,15,50,.8);border:1px solid rgba(168,85,247,.4);color:#c084fc;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.back-btn:active{transform:scale(.9)}
.screen-title{font-size:20px;font-weight:900;text-shadow:0 0 20px rgba(168,85,247,.5)}

.game-area{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px 0;min-height:0}
.main-btn{padding:18px 40px;border-radius:16px;border:none;background:linear-gradient(135deg,#8b5cf6,#6366f1);color:#fff;font-size:14px;font-weight:800;cursor:pointer;letter-spacing:1px;text-transform:uppercase;box-shadow:0 8px 30px rgba(139,92,246,.5);transition:transform .2s}
.main-btn:active{transform:scale(.96)}
.main-btn.full{width:100%;max-width:340px;display:block;margin:0 auto;text-align:center}

.history-list{display:flex;flex-direction:column;gap:10px;padding-bottom:20px}
.history-item{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;background:rgba(20,15,50,.7);border:1px solid rgba(168,85,247,.3);border-radius:16px}
.history-item.win{border-color:rgba(74,222,128,.4)}
.history-item.lose{border-color:rgba(220,38,38,.4)}
.history-left{display:flex;align-items:center;gap:14px}
.history-icon{font-size:22px}
.history-info{display:flex;flex-direction:column;gap:3px}
.history-title{font-size:13px;font-weight:800;color:#fff}
.history-time{font-size:10px;color:#c084fc}
.history-amount{font-size:16px;font-weight:900}
.history-amount.win{color:#4ade80}
.history-amount.lose{color:#ef4444}

.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding-bottom:20px}
.stat-card{padding:22px 16px;border-radius:18px;background:rgba(20,15,50,.7);border:1px solid rgba(168,85,247,.3);text-align:center}
.stat-value{font-size:24px;font-weight:900;color:#ffd700;margin-bottom:6px;text-shadow:0 0 15px rgba(255,215,0,.5)}
.stat-label{font-size:9px;color:#c084fc;letter-spacing:2px;font-weight:700}
</style>
</head><body>
<div class="bg"></div>
<div class="aurora"></div>
<div class="glow-top"></div>
<div class="fire">
<div class="fire-blob b1"></div>
<div class="fire-blob b2"></div>
<div class="fire-blob b3"></div>
<div class="fire-blob b4"></div>
<div class="fire-blob b5"></div>
</div>
<div class="rays" id="rays"></div>
<div class="stars" id="stars"></div>
<div class="particles" id="particles"></div>

<div class="app">
<div class="top-bar">
<div class="logo">COIN FLIP</div>
<div class="balance-pill"><span class="cur">RUB</span><span class="val" id="balance">10000</span></div>
<button class="deposit-btn" onclick="openBot('deposit')">Пополнить</button>
<div class="avatar">U</div>
</div>

<div class="content">
<div class="banner" onclick="openBot('deposit')">
<div class="banner-big">375%</div>
<div class="banner-big">+200FS</div>
<div class="banner-sub">НОВЫМ ИГРОКАМ</div>
</div>

<div class="tabs">
<div class="tab active" onclick="switchTab(this)">Все игры</div>
<div class="tab" onclick="switchTab(this)">Слоты</div>
<div class="tab" onclick="switchTab(this)">Live-игры</div>
</div>

<div class="section">
<div class="section-title">История игр</div>
<div class="games-grid">
<div class="game-card" onclick="openBot('slots')"><img src="slots.jpg" class="game-img" alt="Слоты"><div class="game-name">Слоты</div><div class="game-tag">от 100 ₽</div></div>
<div class="game-card" onclick="openBot('dice')"><img src="dice.jpg" class="game-img" alt="Кости"><div class="game-name">Кости</div><div class="game-tag">от 100 ₽</div></div>
<div class="game-card" onclick="openBot('blackjack')"><img src="blackjack.jpg" class="game-img" alt="Блэкджек"><div class="game-name">Блэкджек</div><div class="game-tag">от 100 ₽</div></div>
</div>
</div>

<div class="section">
<div class="section-title">Слоты</div>
<div class="games-grid">
<div class="game-card" onclick="openBot('roulette')"><img src="roulette.jpg" class="game-img" alt="Рулетка"><div class="game-name">Рулетка</div><div class="game-tag">от 100 ₽</div></div>
<div class="game-card" onclick="openBot('coin')"><img src="coin.jpg" class="game-img" alt="Монетка"><div class="game-name">Монетка</div><div class="game-tag">от 100 ₽</div></div>
<div class="game-card" onclick="openBot('poker')"><img src="poker.jpg" class="game-img" alt="Покер"><div class="game-name">Покер</div><div class="game-tag">от 100 ₽</div></div>
</div>
</div>

</div>
</div>

<div class="bottom-nav">
<div class="nav-item active"><div class="nav-icon">C</div>Казино</div>
<div class="nav-item" onclick="openBot('deposit')"><div class="nav-icon">K</div>Касса</div>
<div class="nav-item" onclick="openBot('history')"><div class="nav-icon">H</div>История</div>
<div class="nav-item" onclick="openBot('stats')"><div class="nav-icon">S</div>Стата</div>
</div><script>
const tg=window.Telegram.WebApp;
tg.ready();tg.expand();tg.setHeaderColor('#0a0420');tg.setBackgroundColor('#0a0420');

let balance=10000;

(function(){const p=new URLSearchParams(window.location.search);const b=p.get('balance');if(b){balance=parseInt(b);const el=document.getElementById('balance');if(el)el.innerText=balance;}})();

(function(){const c=document.getElementById('rays');if(!c)return;for(let i=0;i<8;i++){const r=document.createElement('div');r.className='ray';r.style.left=(10+i*10)+'%';r.style.transform='rotate('+(i*6-25)+'deg)';r.style.animationDelay=(i*0.5)+'s';c.appendChild(r);}})();
(function(){const c=document.getElementById('stars');if(!c)return;for(let i=0;i<60;i++){const s=document.createElement('div');s.className='star';s.style.left=Math.random()*100+'%';s.style.top=Math.random()*100+'%';s.style.animationDuration=(Math.random()*4+2)+'s';s.style.animationDelay=(Math.random()*5)+'s';const sz=Math.random()*2+1;s.style.width=sz+'px';s.style.height=sz+'px';c.appendChild(s);}})();
(function(){const c=document.getElementById('particles');if(!c)return;const colors=['#c084fc','#8b5cf6','#6366f1','#06b6d4','#ffd700'];for(let i=0;i<40;i++){const p=document.createElement('div');p.className='particle';p.style.left=Math.random()*100+'%';p.style.animationDuration=(Math.random()*8+6)+'s';p.style.animationDelay=(Math.random()*8)+'s';const s=Math.random()*3+2;p.style.width=s+'px';p.style.height=s+'px';p.style.background=colors[Math.floor(Math.random()*colors.length)];p.style.color=p.style.background;c.appendChild(p);}})();

function haptic(t){if(!tg.HapticFeedback)return;if(t==='light')tg.HapticFeedback.impactOccurred('light');if(t==='medium')tg.HapticFeedback.impactOccurred('medium');}

function switchTab(el){document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));el.classList.add('active');}

/* ГЛАВНАЯ ФУНКЦИЯ — ОТКРЫВАЕТ БОТА */
function openBot(action){
haptic('medium');
const botUrl="https://t.me/CoinFlipClupRoBot?start="+action;
window.open(botUrl,"_blank");
}

if(tg.BackButton){tg.BackButton.onClick(()=>{tg.close();});}
console.log('%c🔥 COIN FLIP','color:#c084fc;font-size:22px;font-weight:900;letter-spacing:4px');
</script>
</body>
</html>
