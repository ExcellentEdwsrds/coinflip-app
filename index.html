<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{height:100%;overflow:hidden;font-family:'Inter',sans-serif;background:#05030f;color:#fff;-webkit-font-smoothing:antialiased}
body{position:fixed;width:100%;height:100vh;height:100dvh;overflow:hidden;padding-bottom:env(safe-area-inset-bottom)}
.bg{position:fixed;inset:0;z-index:-5;background:linear-gradient(180deg,#05030f 0%,#0a0620 50%,#0f0430 100%)}
.aurora{position:fixed;inset:-30%;z-index:-4;pointer-events:none;background:radial-gradient(ellipse at 20% 20%,rgba(80,50,220,.5) 0%,transparent 45%),radial-gradient(ellipse at 80% 70%,rgba(150,60,220,.45) 0%,transparent 45%),radial-gradient(ellipse at 50% 90%,rgba(50,80,255,.4) 0%,transparent 50%);animation:auroraMove 20s ease-in-out infinite alternate;filter:blur(40px)}
@keyframes auroraMove{0%{transform:translate(0,0) scale(1) rotate(0)}50%{transform:translate(30px,-20px) scale(1.1) rotate(3deg)}100%{transform:translate(-20px,20px) scale(1.15) rotate(-3deg)}}
.fire{position:fixed;inset:0;z-index:-3;pointer-events:none;overflow:hidden}
.fire-blob{position:absolute;border-radius:50%;filter:blur(100px);opacity:.55;mix-blend-mode:screen;animation:fireFloat 12s ease-in-out infinite}

.fire-blob.b2{width:380px;height:380px;background:radial-gradient(circle,#7c3aed,transparent 70%);top:25%;right:-160px;animation-delay:2s}
.fire-blob.b3{width:340px;height:340px;background:radial-gradient(circle,#2563eb,transparent 70%);bottom:-80px;left:15%;animation-delay:4s}
.fire-blob.b4{width:300px;height:300px;background:radial-gradient(circle,#a855f7,transparent 70%);top:55%;left:35%;animation-delay:6s}
.fire-blob.b5{width:280px;height:280px;background:radial-gradient(circle,#06b6d4,transparent 70%);top:10%;left:50%;animation-delay:8s}
@keyframes fireFloat{0%,100%{transform:translate(0,0) scale(1);opacity:.45}33%{transform:translate(40px,-30px) scale(1.15);opacity:.65}66%{transform:translate(-30px,30px) scale(.95);opacity:.5}}
.glow-top{position:fixed;top:0;left:0;right:0;height:300px;z-index:-3;pointer-events:none;background:radial-gradient(ellipse at 50% 0%,rgba(120,80,255,.35) 0%,transparent 70%)}
.rays{position:fixed;inset:0;z-index:-2;pointer-events:none;overflow:hidden;opacity:.3;mix-blend-mode:screen}
.ray{position:absolute;top:-50%;width:2px;height:200%;background:linear-gradient(180deg,transparent,#a855f7,transparent);transform-origin:top center;animation:rayPulse 6s ease-in-out infinite}
@keyframes rayPulse{0%,100%{opacity:0;transform:scaleY(.5)}50%{opacity:1;transform:scaleY(1)}}
.stars{position:fixed;inset:0;z-index:-2;pointer-events:none;overflow:hidden}
.star{position:absolute;width:2px;height:2px;background:#fff;border-radius:50%;opacity:0;animation:twinkle linear infinite}
@keyframes twinkle{0%,100%{opacity:0}50%{opacity:.9}}
.particles{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
.particle{position:absolute;width:3px;height:3px;border-radius:50%;opacity:0;animation:floatUp linear infinite;box-shadow:0 0 12px currentColor,0 0 24px currentColor}
@keyframes floatUp{0%{transform:translateY(100vh) scale(0) rotate(0);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translateY(-10vh) scale(1) rotate(360deg);opacity:0}}
.app{position:relative;z-index:10;width:100%;height:100%;display:flex;flex-direction:column;overflow:hidden}
.top-bar{display:flex;align-items:center;gap:10px;padding:14px 16px;flex-shrink:0}
.logo{font-size:22px;font-weight:900;color:#ffd700;letter-spacing:2px;text-shadow:0 0 20px rgba(255,215,0,.6),0 0 40px rgba(168,85,247,.5)}
.balance-pill{background:rgba(20,15,40,.8);border:1px solid rgba(168,85,247,.35);padding:8px 14px;border-radius:14px;display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;backdrop-filter:blur(20px);box-shadow:0 0 20px rgba(168,85,247,.25)}

.content{flex:1;overflow-y:auto;padding-bottom:100px;scrollbar-width:none}

.banner::before{content:'';position:absolute;top:-50%;right:-30%;width:280px;height:280px;background:radial-gradient(circle,rgba(255,255,255,.3),transparent 70%);animation:bannerPulse 4s ease-in-out infinite}
@keyframes bannerPulse{0%,100%{transform:scale(1);opacity:.6}50%{transform:scale(1.2);opacity:1}}
.banner::after{content:'';position:absolute;top:-100%;left:-100%;width:300%;height:300%;background:linear-gradient(45deg,transparent 45%,rgba(255,255,255,.2) 50%,transparent 55%);animation:bannerShine 4s infinite}
@keyframes bannerShine{0%{transform:translateX(-100%) translateY(-100%)}100%{transform:translateX(100%) translateY(100%)}}
.banner-big{font-size:36px;font-weight:900;color:#ffd700;line-height:1;text-shadow:2px 2px 0 rgba(0,0,0,.5),0 0 30px rgba(255,215,0,.6);position:relative;z-index:2}
.banner-sub{font-size:13px;font-weight:900;color:#fff;margin-top:8px;letter-spacing:2px;position:relative;z-index:2;text-shadow:1px 1px 0 rgba(0,0,0,.5)}
.tabs{display:flex;gap:8px;padding:0 16px 16px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:9px 18px;border-radius:22px;background:rgba(20,15,40,.7);border:1px solid rgba(168,85,247,.25);color:#a78bfa;font-size:12px;font-weight:700;white-space:nowrap;cursor:pointer;backdrop-filter:blur(20px)}
.tab.active{background:linear-gradient(135deg,#7c3aed,#2563eb);color:#fff;border-color:transparent;box-shadow:0 4px 20px rgba(124,58,237,.5)}
.section{padding:0 16px;margin-bottom:20px}
.section-title{font-size:18px;font-weight:900;margin-bottom:12px;text-shadow:0 0 20px rgba(168,85,247,.4)}
.games-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.game-card{background:linear-gradient(145deg,rgba(30,20,55,.9),rgba(15,10,30,.9));border:1px solid rgba(168,85,247,.25);border-radius:16px;padding:12px 6px;text-align:center;cursor:pointer;position:relative;overflow:hidden;backdrop-filter:blur(20px);transition:transform .2s;box-shadow:0 4px 20px rgba(0,0,0,.4),0 0 15px rgba(168,85,247,.15)}
.game-card:active{transform:scale(.94);border-color:#a855f7;box-shadow:0 0 30px rgba(168,85,247,.6)}
.game-card .game-img{width:52px;height:52px;margin:0 auto 10px;border-radius:14px;object-fit:cover;display:block;box-shadow:0 6px 20px rgba(0,0,0,.5),0 0 15px rgba(168,85,247,.3)}
.game-card .game-name{font-size:12px;font-weight:800;color:#fff;line-height:1.2}

.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:rgba(10,6,25,.95);backdrop-filter:blur(24px);border-top:1px solid rgba(168,85,247,.25);display:flex;justify-content:space-around;padding:10px 0 20px;z-index:100;padding-bottom:calc(10px + env(safe-area-inset-bottom));box-shadow:0 -10px 40px rgba(0,0,0,.6)}
.nav-item{text-align:center;font-size:10px;color:#6a5a8a;flex:1;cursor:pointer;font-weight:700}
.nav-item.active{color:#a855f7}
.nav-icon{width:26px;height:26px;margin:0 auto 4px;border-radius:8px;background:rgba(20,15,40,.8);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800}
.nav-item.active .nav-icon{background:linear-gradient(135deg,#7c3aed,#2563eb);color:#fff;box-shadow:0 4px 20px rgba(124,58,237,.6)}
.screen{position:fixed;inset:0;background:#05030f;z-index:500;display:none;flex-direction:column;padding:env(safe-area-inset-top) 16px calc(20px + env(safe-area-inset-bottom));overflow-y:auto}
.screen.active{display:flex;animation:screenIn .3s cubic-bezier(.4,0,.2,1)}
@keyframes screenIn{0%{opacity:0;transform:translateX(30px)}100%{opacity:1;transform:translateX(0)}}
.screen-header{display:flex;align-items:center;gap:14px;padding:20px 0;flex-shrink:0}
.back-btn{width:44px;height:44px;border-radius:14px;background:rgba(20,15,40,.8);border:1px solid rgba(168,85,247,.35);color:#a78bfa;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.back-btn:active{transform:scale(.9)}
.screen-title{font-size:20px;font-weight:900;text-shadow:0 0 20px rgba(168,85,247,.5)}
.game-area{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px 0;min-height:0}
.main-btn{padding:18px 40px;border-radius:16px;border:none;background:linear-gradient(135deg,#7c3aed,#2563eb);color:#fff;font-size:14px;font-weight:800;cursor:pointer;letter-spacing:1px;text-transform:uppercase;box-shadow:0 8px 30px rgba(124,58,237,.5);transition:transform .2s}
.main-btn:active{transform:scale(.96)}
.main-btn:disabled{background:linear-gradient(135deg,#3a1a1a,#6b0f1a);color:rgba(255,255,255,.4);cursor:not-allowed;box-shadow:none}

.result-msg{font-size:20px;font-weight:900;text-align:center;margin-top:20px;min-height:30px}
.result-msg.win{color:#4ade80;text-shadow:0 0 20px rgba(74,222,128,.6)}
.result-msg.lose{color:#ef4444;text-shadow:0 0 20px rgba(239,68,68,.6)}
.result-msg.jackpot{color:#ffd700;text-shadow:0 0 30px rgba(255,215,0,.9);font-size:24px}
.bet-label{font-size:10px;color:#a78bfa;letter-spacing:3px;text-align:center;font-weight:700;margin-bottom:10px;text-transform:uppercase}
.bet-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:100%;max-width:340px;margin:0 auto}
.bet-btn{padding:12px 4px;border-radius:12px;background:rgba(20,15,40,.7);border:1px solid rgba(168,85,247,.3);color:#fff;font-size:13px;font-weight:700;cursor:pointer;text-align:center}
.bet-btn:active{transform:scale(.94)}
.bet-btn.active{background:linear-gradient(135deg,#7c3aed,#2563eb);border-color:transparent;box-shadow:0 4px 20px rgba(124,58,237,.5)}
.slot-machine{background:linear-gradient(145deg,rgba(30,20,55,.9),rgba(15,10,30,.9));border:1px solid rgba(168,85,247,.35);border-radius:24px;padding:30px 22px;width:100%;max-width:340px;box-shadow:0 0 40px rgba(168,85,247,.2)}
.reels{display:flex;justify-content:center;gap:12px;margin-bottom:26px}
.reel{width:76px;height:96px;background:#05030f;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:44px;border:2px solid rgba(168,85,247,.3)}
.reel.spinning{animation:reelSpin .1s linear infinite}
@keyframes reelSpin{0%{transform:translateY(-10px);opacity:.5}50%{transform:translateY(10px);opacity:1}100%{transform:translateY(-10px);opacity:.5}}
.reel.win{border-color:#ffd700;box-shadow:0 0 30px rgba(255,215,0,.6)}
.dice-area{display:flex;justify-content:center;gap:28px;margin:34px 0}
.die{width:96px;height:96px;background:linear-gradient(145deg,#fff,#e0e0e0);border-radius:22px;display:flex;align-items:center;justify-content:center;font-size:56px;font-weight:900;color:#05030f;box-shadow:0 12px 40px rgba(0,0,0,.6),0 0 25px rgba(168,85,247,.4)}
.die.rolling{animation:diceRoll .18s linear infinite}
@keyframes diceRoll{0%{transform:rotate(0)}50%{transform:rotate(180deg) scale(1.05)}100%{transform:rotate(360deg)}}
.bj-table{width:100%;max-width:340px;display:flex;flex-direction:column;gap:16px}
.bj-hand{background:linear-gradient(145deg,rgba(30,20,55,.9),rgba(15,10,30,.9));border:1px solid rgba(168,85,247,.35);border-radius:20px;padding:18px}
.bj-hand-title{font-size:12px;color:#a78bfa;letter-spacing:2px;margin-bottom:14px;display:flex;justify-content:space-between;font-weight:800;text-transform:uppercase}
.bj-hand-title span{color:#ffd700;font-size:18px;font-weight:900;text-shadow:0 0 15px rgba(255,215,0,.6)}
.bj-cards{display:flex;gap:8px;flex-wrap:wrap;min-height:76px}
.bj-card{min-width:54px;height:76px;background:#fff;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:900;color:#05030f;box-shadow:0 6px 20px rgba(0,0,0,.4)}
.bj-card.red{color:#dc2626}
.bj-actions{display:flex;gap:10px;width:100%;max-width:340px;margin-top:18px}
.bj-actions .main-btn{flex:1;padding:14px 6px;font-size:11px;max-width:none}
.roulette-wrap{position:relative;width:250px;height:250px;margin:0 auto 28px}
.roulette-wheel{width:100%;height:100%;border-radius:50%;background:conic-gradient(from 0deg,#dc2626 0deg 9.73deg,#05030f 9.73deg 19.46deg,#dc2626 19.46deg 29.19deg,#05030f 29.19deg 38.92deg,#dc2626 38.92deg 48.65deg,#05030f 48.65deg 58.38deg,#dc2626 58.38deg 68.11deg,#05030f 68.11deg 77.84deg,#dc2626 77.84deg 87.57deg,#05030f 87.57deg 97.3deg,#dc2626 97.3deg 107.03deg,#05030f 107.03deg 116.76deg,#dc2626 116.76deg 126.49deg,#05030f 126.49deg 136.22deg,#dc2626 136.22deg 145.95deg,#05030f 145.95deg 155.68deg,#dc2626 155.68deg 165.41deg,#05030f 165.41deg 175.14deg,#dc2626 175.14deg 184.87deg,#05030f 184.87deg 194.6deg,#dc2626 194.6deg 204.33deg,#05030f 204.33deg 214.06deg,#dc2626 214.06deg 223.79deg,#05030f 223.79deg 233.52deg,#dc2626 233.52deg 243.25deg,#05030f 243.25deg 252.98deg,#dc2626 252.98deg 262.71deg,#05030f 262.71deg 272.44deg,#dc2626 272.44deg 282.17deg,#05030f 282.17deg 291.9deg,#dc2626 291.9deg 301.63deg,#05030f 301.63deg 311.36deg,#dc2626 311.36deg 321.09deg,#05030f 321.09deg 330.82deg,#dc2626 330.82deg 340.55deg,#05030f 340.55deg 350.28deg,#16a34a 350.28deg 360deg);border-radius:50%;border:4px solid #ffd700;box-shadow:0 0 40px rgba(255,215,0,.5),0 0 60px rgba(168,85,247,.3);display:flex;align-items:center;justify-content:center;position:relative}
.roulette-center{width:80px;height:80px;border-radius:50%;background:#05030f;border:3px solid #ffd700;display:flex;align-items:center;justify-content:center;font-size:36px;font-weight:900;color:#ffd700;z-index:2;box-shadow:0 0 30px rgba(255,215,0,.5)}
.roulette-bets{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:340px;margin:0 auto}
.rl-btn{padding:16px;border-radius:14px;border:1px solid;background:rgba(20,15,40,.7);font-size:12px;font-weight:800;cursor:pointer;letter-spacing:1px;text-transform:uppercase}
.rl-btn.red{border-color:rgba(220,38,38,.7);color:#ff8a8a}
.rl-btn.black{border-color:rgba(168,85,247,.5);color:#fff}
.rl-btn.zero{border-color:rgba(22,163,74,.7);color:#4ade80;grid-column:span 2}
.coin-wrap{perspective:1400px;margin:26px 0}
.coin{position:relative;width:180px;height:180px;transform-style:preserve-3d;transition:transform 2.5s cubic-bezier(.3,.8,.4,1.2)}

.coin-tails{transform:rotateY(180deg)}
.coin-face .coin-emoji{font-size:56px;margin-bottom:6px}
.coin-face .coin-text{font-size:12px;letter-spacing:4px;font-weight:900}
.history-list{display:flex;flex-direction:column;gap:10px;padding-bottom:20px}

</div><script>
const tg=window.Telegram.WebApp;
tg.ready();tg.expand();tg.setHeaderColor('#05030f');tg.setBackgroundColor('#05030f');

let balance=10000;
let coinBet=100;
let coinSide='heads';

(function(){const p=new URLSearchParams(window.location.search);const b=p.get('balance');if(b){balance=parseInt(b);const el=document.getElementById('balance');if(el)el.innerText=balance;}})();

(function(){const c=document.getElementById('rays');if(!c)return;for(let i=0;i<8;i++){const r=document.createElement('div');r.className='ray';r.style.left=(10+i*10)+'%';r.style.transform='rotate('+(i*6-25)+'deg)';r.style.animationDelay=(i*0.5)+'s';c.appendChild(r);}})();
(function(){const c=document.getElementById('stars');if(!c)return;for(let i=0;i<60;i++){const s=document.createElement('div');s.className='star';s.style.left=Math.random()*100+'%';s.style.top=Math.random()*100+'%';s.style.animationDuration=(Math.random()*4+2)+'s';s.style.animationDelay=(Math.random()*5)+'s';const sz=Math.random()*2+1;s.style.width=sz+'px';s.style.height=sz+'px';c.appendChild(s);}})();
(function(){const c=document.getElementById('particles');if(!c)return;const colors=['#a855f7','#7c3aed','#2563eb','#06b6d4','#ffd700'];for(let i=0;i<40;i++){const p=document.createElement('div');p.className='particle';p.style.left=Math.random()*100+'%';p.style.animationDuration=(Math.random()*8+6)+'s';p.style.animationDelay=(Math.random()*8)+'s';const s=Math.random()*3+2;p.style.width=s+'px';p.style.height=s+'px';p.style.background=colors[Math.floor(Math.random()*colors.length)];p.style.color=p.style.background;c.appendChild(p);}})();

const AudioCtx=window.AudioContext||window.webkitAudioContext;let audioCtx;
function initAudio(){if(!audioCtx)audioCtx=new AudioCtx();}
function beep(f,d,t,v){try{initAudio();const o=audioCtx.createOscillator();const g=audioCtx.createGain();o.type=t||'sine';o.frequency.value=f;g.gain.value=v||0.04;o.connect(g);g.connect(audioCtx.destination);o.start();g.gain.exponentialRampToValueAtTime(0.0001,audioCtx.currentTime+d);o.stop(audioCtx.currentTime+d);}catch(e){}}
function soundClick(){beep(1000,0.04,'sine',0.02);}
function soundSpin(){beep(500,0.05,'triangle',0.03);}
function haptic(t){if(!tg.HapticFeedback)return;if(t==='light')tg.HapticFeedback.impactOccurred('light');if(t==='medium')tg.HapticFeedback.impactOccurred('medium');if(t==='heavy')tg.HapticFeedback.impactOccurred('heavy');}

function switchTab(el){document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));el.classList.add('active');}

function playGame(name){
haptic('medium');
soundSpin();
if(name==='slots'){tg.sendData(JSON.stringify({action:"play_slots",bet:100}));tg.showAlert("🎰 Ставка 100 ₽ отправлена! Результат в чате.");}
else if(name==='dice'){tg.sendData(JSON.stringify({action:"play_dice",bet:100}));tg.showAlert("🎲 Ставка 100 ₽ отправлена! Результат в чате.");}
else if(name==='blackjack'){tg.sendData(JSON.stringify({action:"play_blackjack",bet:100}));tg.showAlert("🃏 Ставка 100 ₽ отправлена! Результат в чате.");}
else if(name==='roulette'){tg.sendData(JSON.stringify({action:"play_roulette",bet:100,bet_type:'red'}));tg.showAlert("🎡 Ставка 100 ₽ отправлена! Результат в чате.");}
else if(name==='coin'){tg.sendData(JSON.stringify({action:"play_coin",bet:coinBet,side:coinSide}));tg.showAlert("🪙 Ставка "+coinBet+" ₽ отправлена! Результат в чате.");}
else if(name==='poker'){tg.sendData(JSON.stringify({action:"play_poker",bet:100}));tg.showAlert("♠ Ставка 100 ₽ отправлена! Результат в чате.");}
}

function openDeposit(){
haptic('light');
soundClick();
tg.sendData(JSON.stringify({action:"open_deposit"}));
tg.showAlert("💳 Открываю кассу в чате...");
}

if(tg.BackButton){tg.BackButton.onClick(()=>{tg.close();});}

console.log('%c🔥 COIN FLIP','color:#a855f7;font-size:22px;font-weight:900;letter-spacing:4px');
</script>
</body>
</html>
