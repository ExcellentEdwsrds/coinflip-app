<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1a0d2e">
<title>Magic Spin</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{height:100%;overflow:hidden;font-family:'Inter',sans-serif;background:#1a0d2e;color:#fff;-webkit-font-smoothing:antialiased}
body{position:fixed;width:100%;height:100vh;height:100dvh;overflow:hidden;padding-bottom:env(safe-area-inset-bottom)}
.svg-icon{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;display:block}
.svg-icon-fill{width:24px;height:24px;fill:currentColor;stroke:none;display:block}

.loader{position:fixed;inset:0;z-index:99999;background:linear-gradient(180deg,#1a0d2e 0%,#2a1548 50%,#3a1d5c 100%);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:30px;transition:opacity .8s ease,visibility .8s ease}
.loader.hidden{opacity:0;visibility:hidden;pointer-events:none}
.loader-logo{font-size:48px;font-weight:900;background:linear-gradient(135deg,#a855f7,#c084fc,#e9d5ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;letter-spacing:8px;filter:drop-shadow(0 0 30px rgba(168,85,247,.8));animation:loaderPulse 2s ease-in-out infinite}
@keyframes loaderPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.loader-sub{font-size:12px;color:#a78bfa;letter-spacing:6px;font-weight:600;text-transform:uppercase;margin-top:-16px}
.loader-ring{width:80px;height:80px;position:relative}
.loader-ring::before,.loader-ring::after{content:'';position:absolute;inset:0;border-radius:50%;border:3px solid transparent}
.loader-ring::before{border-top-color:#a855f7;border-right-color:#a855f7;animation:ringSpin 1s linear infinite}
.loader-ring::after{inset:12px;border-bottom-color:#c084fc;border-left-color:#c084fc;animation:ringSpin 1.5s linear infinite reverse}
@keyframes ringSpin{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}
.loader-bar{width:200px;height:3px;background:rgba(168,85,247,.2);border-radius:2px;overflow:hidden}
.loader-fill{width:0;height:100%;background:linear-gradient(90deg,#a855f7,#c084fc);animation:fillBar 2s ease-in-out forwards;box-shadow:0 0 15px #a855f7}
@keyframes fillBar{0%{width:0}100%{width:100%}}

.bg{position:fixed;inset:0;z-index:-5;background:linear-gradient(180deg,#1a0d2e 0%,#2a1548 50%,#3a1d5c 100%)}
.aurora{position:fixed;inset:-30%;z-index:-4;pointer-events:none;background:radial-gradient(ellipse at 20% 20%,rgba(140,80,255,.5) 0%,transparent 45%),radial-gradient(ellipse at 80% 70%,rgba(200,80,255,.4) 0%,transparent 45%);animation:auroraMove 20s ease-in-out infinite alternate;filter:blur(50px)}
@keyframes auroraMove{0%{transform:translate(0,0) scale(1)}100%{transform:translate(-30px,20px) scale(1.15)}}
.stars{position:fixed;inset:0;z-index:-2;pointer-events:none;overflow:hidden}
.star{position:absolute;width:2px;height:2px;background:#fff;border-radius:50%;opacity:0;animation:twinkle linear infinite}
@keyframes twinkle{0%,100%{opacity:0}50%{opacity:.9}}
.particles{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
.particle{position:absolute;width:2px;height:2px;border-radius:50%;opacity:0;animation:floatUp linear infinite;box-shadow:0 0 10px currentColor}
@keyframes floatUp{0%{transform:translateY(100vh) scale(0);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translateY(-10vh) scale(1);opacity:0}}

.app{position:relative;z-index:10;width:100%;height:100%;display:flex;flex-direction:column;overflow:hidden}

.top-bar{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;flex-shrink:0;gap:8px}
.logo-icon{width:42px;height:42px;display:flex;align-items:center;justify-content:center;color:#a855f7}
.balance-pill{background:rgba(40,25,70,.85);border:1px solid rgba(140,80,255,.4);padding:8px 12px;border-radius:12px;display:flex;align-items:center;gap:6px;font-size:14px;font-weight:700;backdrop-filter:blur(20px);color:#fff}
.balance-pill .val{color:#fff;font-weight:800}
.deposit-btn{background:linear-gradient(135deg,#4ade80,#22c55e);color:#0a2e15;border:none;padding:10px 16px;border-radius:12px;font-size:13px;font-weight:800;cursor:pointer;box-shadow:0 4px 15px rgba(74,222,128,.4)}
.bell-btn{width:42px;height:42px;border-radius:12px;background:rgba(40,25,70,.85);border:1px solid rgba(140,80,255,.3);display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;color:#c084fc}
.bell-btn .badge{position:absolute;top:-4px;right:-4px;background:#ef4444;color:#fff;font-size:10px;font-weight:900;padding:2px 6px;border-radius:10px;min-width:18px;text-align:center}
.avatar{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,#a855f7,#6366f1);display:flex;align-items:center;justify-content:center;border:2px solid rgba(140,80,255,.5);cursor:pointer;color:#fff}

.content{flex:1;overflow-y:auto;padding-bottom:100px;scrollbar-width:none}
.content::-webkit-scrollbar{display:none}

.banner{margin:0 14px 16px;border-radius:20px;background:linear-gradient(135deg,#5b21b6 0%,#7c3aed 50%,#a855f7 100%);padding:22px 20px;position:relative;overflow:hidden;box-shadow:0 10px 40px rgba(124,58,237,.5);min-height:180px;display:flex;flex-direction:column;justify-content:center}
.banner::before{content:'';position:absolute;top:-40%;right:-20%;width:220px;height:220px;background:radial-gradient(circle,rgba(255,215,0,.3),transparent 70%);animation:bannerPulse 4s ease-in-out infinite}
@keyframes bannerPulse{0%,100%{transform:scale(1);opacity:.6}50%{transform:scale(1.2);opacity:1}}
.banner-tag{font-size:14px;font-weight:800;color:#ffd700;position:relative;z-index:2;margin-bottom:4px}
.banner-title{font-size:20px;font-weight:900;color:#fff;position:relative;z-index:2;margin-bottom:4px}
.banner-sub{font-size:12px;color:rgba(255,255,255,.8);position:relative;z-index:2;margin-bottom:16px}
.banner-btn{background:linear-gradient(135deg,#a855f7,#8b5cf6);color:#fff;border:none;padding:12px 24px;border-radius:12px;font-size:14px;font-weight:800;cursor:pointer;box-shadow:0 6px 20px rgba(168,85,247,.5);position:relative;z-index:2;align-self:flex-start}
.banner-gift{position:absolute;right:-20px;bottom:-20px;opacity:.35;pointer-events:none;color:#ffd700}

.search-row{display:flex;gap:8px;padding:0 14px 12px}
.search-wrap{flex:1;position:relative}
.search-wrap .search-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:#a78bfa;pointer-events:none}
.search-input{width:100%;background:rgba(40,25,70,.7);border:1px solid rgba(140,80,255,.3);border-radius:14px;padding:12px 16px 12px 42px;color:#fff;font-size:14px;outline:none}
.search-input::placeholder{color:#a78bfa}
.filter-btn{background:rgba(40,25,70,.7);border:1px solid rgba(140,80,255,.3);border-radius:14px;padding:12px 16px;color:#fff;font-size:13px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:6px}
.filter-btn .chev{width:14px;height:14px;color:#a78bfa}

.lobby-row{padding:0 14px 16px}
.lobby-btn{width:100%;background:rgba(40,25,70,.7);border:1px solid rgba(140,80,255,.3);border-radius:14px;padding:14px 16px;color:#fff;font-size:14px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:space-between}
.lobby-btn .left{display:flex;align-items:center;gap:10px}
.lobby-btn .chev{width:16px;height:16px;color:#a78bfa}

.section{padding:0 14px;margin-bottom:18px}
.section-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.section-title{font-size:17px;font-weight:900;display:flex;align-items:center;gap:8px}
.section-title .crown{width:20px;height:20px;color:#ffd700}

.games-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.game-card{background:linear-gradient(145deg,rgba(40,25,70,.9),rgba(25,15,45,.9));border:1px solid rgba(140,80,255,.3);border-radius:18px;overflow:hidden;cursor:pointer;position:relative;transition:all .2s;box-shadow:0 6px 25px rgba(0,0,0,.5)}
.game-card:active{transform:scale(.96);border-color:#c084fc;box-shadow:0 0 35px rgba(192,132,252,.7)}
.game-card .game-img{width:100%;height:120px;object-fit:cover;display:block}
.game-card .game-name{font-size:13px;font-weight:800;color:#fff;padding:10px 12px 4px;line-height:1.2}
.game-card .game-tag{font-size:10px;color:#a78bfa;padding:0 12px 10px;font-weight:600}

.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:rgba(20,10,35,.98);backdrop-filter:blur(24px);border-top:1px solid rgba(140,80,255,.3);display:flex;justify-content:space-around;align-items:center;padding:10px 0 18px;z-index:100;padding-bottom:calc(10px + env(safe-area-inset-bottom))}
.nav-item{text-align:center;font-size:10px;color:#7a5aa0;flex:1;cursor:pointer;font-weight:700;position:relative;display:flex;flex-direction:column;align-items:center;gap:4px}
.nav-item.active{color:#c084fc}
.nav-item.center{position:relative;margin-top:-20px}
.nav-item.center .nav-circle{width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,#a855f7,#6366f1);display:flex;align-items:center;justify-content:center;box-shadow:0 8px 30px rgba(168,85,247,.6);border:4px solid #1a0d2e;color:#fff}

.game-screen{position:fixed;inset:0;background:rgba(10,5,20,.98);backdrop-filter:blur(30px);z-index:600;display:none;flex-direction:column;padding:env(safe-area-inset-top) 20px calc(20px + env(safe-area-inset-bottom));overflow-y:auto}
.game-screen.active{display:flex;animation:screenIn .3s cubic-bezier(.4,0,.2,1)}
@keyframes screenIn{0%{opacity:0;transform:translateY(20px)}100%{opacity:1;transform:translateY(0)}}
.game-header{display:flex;align-items:center;justify-content:space-between;padding:20px 0 24px}
.game-header .left{display:flex;align-items:center;gap:14px}
.game-back{width:44px;height:44px;border-radius:14px;background:rgba(40,25,70,.8);border:1px solid rgba(140,80,255,.4);color:#c084fc;cursor:pointer;display:flex;align-items:center;justify-content:center}
.game-title{font-size:22px;font-weight:900}
.game-balance{background:rgba(40,25,70,.8);border:1px solid rgba(140,80,255,.4);padding:8px 14px;border-radius:12px;font-size:14px;font-weight:800;color:#ffd700}

.game-area{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px 0;min-height:0}
.game-field{width:100%;max-width:340px;background:linear-gradient(145deg,rgba(40,25,70,.9),rgba(25,15,45,.9));border:1px solid rgba(140,80,255,.4);border-radius:24px;padding:30px 22px;text-align:center;box-shadow:0 0 40px rgba(168,85,247,.2)}

.bet-label{font-size:10px;color:#a78bfa;letter-spacing:3px;text-align:center;font-weight:700;margin-bottom:10px;text-transform:uppercase}
.bet-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:100%;max-width:340px;margin:0 auto}
.bet-btn{padding:12px 4px;border-radius:12px;background:rgba(40,25,70,.7);border:1px solid rgba(168,85,247,.4);color:#fff;font-size:13px;font-weight:700;cursor:pointer;text-align:center}
.bet-btn.active{background:linear-gradient(135deg,#a855f7,#6366f1);border-color:transparent;box-shadow:0 4px 20px rgba(139,92,246,.5)}

.main-btn{padding:16px 36px;border-radius:14px;border:none;background:linear-gradient(135deg,#a855f7,#6366f1);color:#fff;font-size:15px;font-weight:800;cursor:pointer;letter-spacing:1px;text-transform:uppercase;box-shadow:0 8px 25px rgba(168,85,247,.5);width:100%;max-width:340px;margin-top:16px}
</style>
</head><body>

</div><script>
const tg=window.Telegram.WebApp;
tg.ready();tg.expand();tg.setHeaderColor('#1a0d2e');tg.setBackgroundColor('#1a0d2e');

let balance=10000;
let currentGame='';
let currentBet=100;

setTimeout(()=>{document.getElementById('loader').classList.add('hidden');},2200);

(function(){const c=document.getElementById('stars');if(!c)return;for(let i=0;i<60;i++){const s=document.createElement('div');s.className='star';s.style.left=Math.random()*100+'%';s.style.top=Math.random()*100+'%';s.style.animationDuration=(Math.random()*4+2)+'s';s.style.animationDelay=(Math.random()*5)+'s';const sz=Math.random()*2+1;s.style.width=sz+'px';s.style.height=sz+'px';c.appendChild(s);}})();
(function(){const c=document.getElementById('particles');if(!c)return;const colors=['#a855f7','#8b5cf6','#c084fc','#6366f1'];for(let i=0;i<40;i++){const p=document.createElement('div');p.className='particle';p.style.left=Math.random()*100+'%';p.style.animationDuration=(Math.random()*8+6)+'s';p.style.animationDelay=(Math.random()*8)+'s';const s=Math.random()*3+2;p.style.width=s+'px';p.style.height=s+'px';p.style.background=colors[Math.floor(Math.random()*colors.length)];p.style.color=p.style.background;c.appendChild(p);}})();

/* БАЛАНС — ИЗ ССЫЛКИ */
(function(){
const p=new URLSearchParams(window.location.search);
const b=p.get('balance');
if(b){
balance=parseInt(b);
}
updateUI();
})();

function updateUI(){const el=document.getElementById('balance');if(el)el.innerText=balance;const gb=document.getElementById('gameBalance');if(gb)gb.innerText=balance+' ₽';}
function haptic(t){if(!tg.HapticFeedback)return;if(t==='light')tg.HapticFeedback.impactOccurred('light');if(t==='medium')tg.HapticFeedback.impactOccurred('medium');}
function filterGames(){const q=document.getElementById('searchInput').value.toLowerCase();document.querySelectorAll('.game-card').forEach(c=>{const n=c.getAttribute('data-name');c.style.display=n.includes(q)?'block':'none';});}
function setBet(v,el){haptic('light');currentBet=v;document.querySelectorAll('.bet-btn').forEach(b=>b.classList.remove('active'));el.classList.add('active');}
function openGame(game){haptic('medium');currentGame=game;document.getElementById('gameScreen').classList.add('active');const titles={slots:'Слоты',dice:'Кости',blackjack:'Блэкджек',roulette:'Рулетка',coin:'Монетка',poker:'Покер'};document.getElementById('gameTitle').innerText=titles[game];updateUI();renderGame(game);}
function closeGame(){haptic('light');document.getElementById('gameScreen').classList.remove('active');}

function renderGame(game){
const area=document.getElementById('gameArea');
area.innerHTML='<div class="game-field"><div style="font-size:22px;font-weight:900;margin-bottom:12px">Игра проходит в чате</div><div style="font-size:13px;color:#a78bfa;margin-bottom:24px;line-height:1.5">Нажми кнопку — бот откроется и сразу запустит игру со ставкой '+currentBet+' руб.</div><button class="main-btn" onclick="playInBot(\''+game+'\')">Играть в чате</button></div>';
}

function playInBot(game){
haptic('medium');
const url="https://t.me/CoinFlipClupRoBot?start="+game+"_"+currentBet;
window.open(url,"_blank");
}

function openBot(action){haptic('medium');window.open("https://t.me/CoinFlipClupRoBot?start="+action,"_blank");}

if(tg.BackButton){tg.BackButton.onClick(()=>{const g=document.getElementById('gameScreen');if(g.classList.contains('active'))closeGame();else tg.close();});}
console.log('%c MAGIC SPIN','color:#a855f7;font-size:22px;font-weight:900;letter-spacing:4px');
</script>
</body>
</html>
